<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, sans-serif; width: 300px; padding: 12px; margin: 0; background: #f8fafc; }
    h4 { margin: 0 0 10px 0; text-align: center; color: #0f172a; font-size: 14px; }
    .drop-zone {
      border: 2px dashed #94a3b8; border-radius: 8px; padding: 30px 10px;
      text-align: center; background: #fff; color: #64748b; cursor: pointer; transition: all 0.2s;
    }
    .drop-zone:hover { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
    .drop-zone.hover { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
    .result {
      margin-top: 8px; font-size: 11px; word-break: break-all;
      color: #166534; font-weight: bold; display: none;
      background: #f0fdf4; padding: 6px 8px; border-radius: 4px;
    }
    .tip { margin-top: 6px; font-size: 11px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <h4>内网媒体助手</h4>
  <div class="drop-zone" id="drop-zone">
    拖入图片 / 视频<br><span style="font-size:11px;">自动生成内网 HTTP 链接</span>
  </div>
  <input type="file" id="file-input" style="display:none;" accept="image/*,video/*">
  <div class="result" id="result"></div>
  <div class="tip" id="status">连接中...</div>
  <script src="popup.js"></script>
</body>
</html>
